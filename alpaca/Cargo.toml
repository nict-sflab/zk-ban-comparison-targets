[package]
name = "bench-alpaca"
version = "0.1.0"
edition = "2024"

[dependencies]
alpaca = { git = "https://github.com/jiwonkimpark/alpaca" }
ff = "0.13"
flate2 = "1.0.34"
nova-snark = { version = "0.37.0", default-features = false }
rand = "0.8.4"
bincode = { version = "1.3.3", default-features = false }


[patch."https://github.com/jiwonkimpark/alpaca"]
circ = { path = "./circ-alpaca" }
circ_fields = { path = "circ-alpaca/circ_fields" }

[profile.dev]
overflow-checks = false
